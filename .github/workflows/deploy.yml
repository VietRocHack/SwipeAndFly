name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy swipeandfly-server \
            --source=backend \
            --region=us-central1 \
            --project=vietrochack-lab \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=vietrochack-lab" \
            --set-secrets="GEMINI_API_KEY=swipeandfly-gemini-api-key:latest"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_MAPS_API_KEY: ${{ secrets.VITE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:swipeandfly --project vietrochack-lab
